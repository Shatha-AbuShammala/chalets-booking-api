version: "3.9"

services:
  api:
    build: .
    container_name: chalets-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/chalets
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: chalets-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: